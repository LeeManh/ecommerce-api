spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ecommerce.backend.*"

jwt:
  access-token:
    secret: ed49c25cda3774ccceb0985ac6b8da55ff99951ffce8665d5b3680d7bf810939
    expiration: 900000        # 15 phút
  refresh-token:
    secret: 309ce6b2d6f236d3994a254bb5199f47d723d19a1e822c0bb5aa53ca46170c84
    expiration: 604800000     # 7 ngày

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%15.15t] [correlationId=%X{correlationId:-}] %-40.40logger{39} : %m%n%wEx"

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173